name: Run tests

on:
  pull_request:
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dkotlin.incremental=false -Dorg.gradle.jvmargs="-Xmx6g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1g"

jobs:
  build-test:
    name: Run tests
    runs-on: macos-latest
    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2

      - name: Set up JDK
        uses: actions/setup-java@v5.2.0
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5.0.2

      - name: Kill all simulators (force stop CoreSimulatorService)
        run: |
          if pgrep -x com.apple.CoreSimulator.CoreSimulatorService > /dev/null; then
            echo "CoreSimulatorService is running. Killing it..."
            killall -9 com.apple.CoreSimulator.CoreSimulatorService
          else
            echo "CoreSimulatorService is not running. Nothing to kill."
          fi

      - name: Set up iOS simulator
        uses: futureware-tech/simulator-action@e89aa8f93d3aec35083ff49d2854d07f7186f7f5 # v5
        with:
          model: iPhone 17
          shutdown_after_job: false

      - name: Run Detekt
        run: ./gradlew detektAll

      - name: Run tests and coverage
        run: >
          ./gradlew
          allTests
          :koverXmlReport

      - name: Run Swift tests
        run: |
          cd iosApp
          xcodebuild test -scheme iosApp -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.2'

      - name: Publish unit test results
        uses: EnricoMi/publish-unit-test-result-action/macos@v2.23.0
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          junit_files: '*/**/test-results/**/*.xml'

      - name: Upload reports
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: reports
          path: "build/reports"

  run-danger:
    name: Danger CodeChecks
    runs-on: ubuntu-latest
    needs: build-test
    if: always()
    permissions:
      checks: write
      contents: write
      issues: write
      pull-requests: write
      statuses: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2

      - name: Checkout wiki for reference coverage report
        uses: actions/checkout@v6.0.2
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki

      - name: Download reports
        uses: actions/download-artifact@v8.0.1
        with:
          name: reports
          path: "build/reports"

      - name: Update the reference coverage report
        if: github.event_name == 'push'
        run: |
          cp build/reports/kover/report.xml wiki/ref-report.xml
          cd wiki
          git config --local user.name "GitHub Actions"
          git config --local user.email "actions@github.com"
          git add ref-report.xml
          git commit -m 'update reference coverage report' || exit 0
          git push

      - name: Danger CodeChecks
        uses: danger/kotlin@1.3.4
        if: github.event_name == 'pull_request'
        with:
          dangerfile: config/danger/CodeChecks.df.kts
          args: --failOnErrors --base main --id CodeChecks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete Artifact
        uses: geekyeggo/delete-artifact@v6.0.0
        if: always()
        with:
          name: reports
